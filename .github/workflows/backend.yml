name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: chaum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chaum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/chaum_test?sslmode=disable
      TEST_DATABASE_ISOLATED: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Initialize disposable database only
        env:
          PGPASSWORD: isolated-ci-only
        run: psql -h 127.0.0.1 -U postgres -d chaum_test -v ON_ERROR_STOP=1 -f internal/schema/isolated-test-schema.sql
      - name: Test including database integration
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -coverprofile=coverage.out -json ./... | tee test-results.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = [json.loads(line) for line in Path('test-results.jsonl').read_text().splitlines()]
          skipped = [r for r in results if r.get('Action') == 'skip']
          if skipped:
              raise SystemExit('Skipped tests: integration must run in CI')
          passed = sum(r.get('Action') == 'pass' and 'Test' in r for r in results)
          print(f'{passed} tests/subtests passed; zero skipped')
          PY
      - run: go vet ./...
      - run: go build ./...
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            test-results.jsonl
            coverage.out
          retention-days: 7
